# The script is POSIX sh, checked by ShellCheck on every push.
name: Check

on:
  push:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck --shell=sh install.sh
      - name: It refuses an unknown host before touching anything
        run: |
          if out=$(sh install.sh --host nope --yes 2>&1); then echo "accepted"; exit 1; fi
          echo "$out" | grep -q "unknown host nope"
