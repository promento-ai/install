# The script is POSIX sh: on every push, ShellCheck reads it and its tests, then the tests run it whole, with stand-ins
# for docker, curl and sleep (tests/run.sh).
name: Check

on:
  push:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck --shell=sh install.sh tests/run.sh tests/stubs/docker tests/stubs/curl tests/stubs/sleep
      - run: sh tests/run.sh
